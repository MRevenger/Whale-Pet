# Bundle patch for dsh-persona-evolve.
#
# The row must live in the host layer: it owns the pre-step listener that
# buffers the owner's turns and the loader row it remounts when a persona
# change has to reach sessions that are already running.
- insert:
    - id: persona-evolve
      name: 'dsh-persona-evolve'
      config:
        # Master switch. false = observe nothing, call no model, touch no file.
        enabled: true

        # Settings entry id that carries the persona card. The default reuses
        # dsh-cosplay's row so this plugin never introduces a second persona.
        entryId: 'cosplay-core'

        # Role id inside that entry whose card fields are allowed to evolve.
        roleId: 'dafeiyu'

        # Card fields the judge may change. Anything else
        # (name/description/system_prompt/first_mes/...) stays human-owned.
        editableSections:
          - style
          - rules
          - behavior

        # No keyword gate. Every turn goes into a small pending buffer; once
        # this many turns are queued, one small model call reads them and
        # decides whether the speaking style should shift at all.
        batchSize: 6

        # true = a judged change is written to the card, snapshotted and hot
        # reloaded right away (rollback with persona_rollback).
        # false = the change is stored as a suggestion and waits for a confirm.
        autoApply: true

        # Injected only when autoApply is false: tells the model that pending
        # suggestions exist and which tool confirms them.
        pendingNotice: true

        # Agent presets to rebind after a persona change. Leave empty when the
        # persona is carried by a settings entry, as dsh-cosplay does.
        presets: []

        # Model used for the batched judge call (never per turn).
        learnProvider: 'deepseek'
        learnModel: 'deepseek-chat'
        learnMaxTokens: 800

        # Short-term memory refresh cadence (turns) and long-term promotion
        # threshold (turns of accumulated short-term memory).
        shortTermEveryTurns: 2
        longTermPromoteTurns: 20
        longTermUseLlm: true

        # Token budget of the read-only persona digest tool.
        digestTokens: 200

        # Empty = $DSH_HOME/persona-evolve.
        dataDir: ''
